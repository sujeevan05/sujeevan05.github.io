<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Silly Story Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Silly Story Generator</h1>

  <input id="custom-name" type="text" placeholder="Enter custom name">

  <div>
    <label><input type="radio" id="us" name="unit" checked> US</label>
    <label><input type="radio" id="uk" name="unit"> UK</label>

  <button class="generate">Generate Story</button>

  <p class="story"></p>

  <script src="script.js"></script>
</body>
</html>
